name: contributions

on:
  schedule:
    - cron: "17 6 * * *"   # daily, ~01:17 Toronto
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: generate svg
        run: npm run generate
        env:
          # Built-in token covers public contributions. To also count private /
          # SSO work, make a classic PAT with read:user scope and save it as a
          # repo secret named GH_TOKEN — this line will prefer it automatically.
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git diff --cached --quiet || git commit -m "chore: update contributions graph"
          git push
